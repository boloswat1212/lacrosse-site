<!DOCTYPE html>
<html>
<head>
  <title>Events</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-black">

<!-- NAV -->
<div class="bg-green-500 px-4 py-3 flex justify-between items-center">
  <h1 class="text-xl md:text-2xl font-bold">LacrosseHub</h1>

  <div class="hidden md:flex space-x-6 font-semibold">
    <a href="index.html">Home</a>
    <a href="rankings.html">Rankings</a>
    <a href="players.html">Players</a>
    <a href="events.html" class="underline">Events</a>
  </div>

  <button class="md:hidden text-2xl" onclick="toggleMenu()">☰</button>
</div>

<div id="mobileMenu" class="hidden bg-green-400 px-4 py-4 space-y-3 md:hidden">
  <a href="index.html">Home</a>
  <a href="rankings.html">Rankings</a>
  <a href="players.html">Players</a>
  <a href="events.html">Events</a>
</div>

<!-- MAIN -->
<div class="max-w-5xl mx-auto mt-6 p-4">

  <h2 class="text-2xl font-bold mb-6">Events</h2>

  <div id="events" class="space-y-4"></div>

</div>

<script>
function toggleMenu(){
  document.getElementById("mobileMenu").classList.toggle("hidden");
}

// AUTO REMOVE PAST EVENTS
function isFuture(dateStr) {
  const today = new Date();
  const eventDate = new Date(dateStr);
  return eventDate >= today;
}

fetch("/api/events")
  .then(r => r.json())
  .then(data => {

    const futureEvents = data.filter(e => isFuture(e.date));

    document.getElementById("events").innerHTML =
      futureEvents.map(e => `
        <div class="bg-white p-4 rounded shadow hover:shadow-lg transition">
          <div class="text-lg font-bold">${e.name}</div>
          <div class="text-gray-600">${e.location}</div>
          <div class="text-blue-600 font-semibold">${e.date}</div>
        </div>
      `).join("");

  });
</script>

</body>
</html>
