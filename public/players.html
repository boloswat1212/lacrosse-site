<!DOCTYPE html>
<html>
<head>
  <title>Players</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-black">

<!-- NAV -->
<div class="bg-green-500 px-6 py-3 flex justify-between items-center">
  <h1 class="text-2xl font-bold">LacrosseHub</h1>

  <div class="space-x-6 font-semibold">
    <a href="index.html">Home</a>
    <a href="rankings.html">Rankings</a>
    <a href="players.html" class="underline">Players</a>
    <a href="events.html">Events</a>
  </div>
</div>

<!-- SUB NAV -->
<div class="bg-gray-800 text-white px-6 py-3 flex gap-6 text-sm">
  <span class="font-bold">RECRUITING DATABASE</span>
  <span class="text-green-400">PLAYERS</span>
  <span>RANKINGS</span>
  <span>STAR RATINGS</span>
</div>

<!-- MAIN -->
<div class="max-w-7xl mx-auto mt-8 px-6">

  <div class="bg-white p-6 rounded shadow">
    <h2 class="text-2xl font-bold mb-4">Top Recruits</h2>

    <!-- FILTER -->
    <div class="flex gap-4 mb-6">
      <select id="classFilter" class="border p-2">
        <option value="all">All Classes</option>
        <option value="2030">2030</option>
        <option value="2029">2029</option>
        <option value="2028">2028</option>
        <option value="2027">2027</option>
        <option value="2026">2026</option>
      </select>
    </div>

    <!-- TABLE -->
    <div class="overflow-x-auto">
      <table class="w-full text-sm border">

        <thead class="bg-gray-200">
          <tr>
            <th class="p-3 text-left">PLAYER</th>
            <th class="p-3 text-left">CLASS</th>
            <th class="p-3 text-left">POSITION</th>
            <th class="p-3 text-left">STATE</th>
            <th class="p-3 text-left">SCHOOL</th>
            <th class="p-3 text-left">⭐</th>
            <th class="p-3 text-left">RANK</th>
            <th class="p-3 text-left">COMMIT</th>
          </tr>
        </thead>

        <tbody id="players"></tbody>

      </table>
    </div>

  </div>

</div>

<script>
let playersData = [];

fetch("/api/players")
  .then(res => res.json())
  .then(data => {
    playersData = data;
    renderPlayers();
  });

document.getElementById("classFilter").addEventListener("change", renderPlayers);

function stars(num) {
  return "★".repeat(Number(num) || 0);
}

function renderPlayers() {
  const selectedClass = document.getElementById("classFilter").value;

  const filtered = playersData.filter(p =>
    selectedClass === "all" || p.grad == selectedClass
  );

  document.getElementById("players").innerHTML =
    filtered.map((p, i) => `
      <tr class="border-b hover:bg-gray-100">
        <td class="p-3 font-semibold">${p.name || "-"}</td>
        <td class="p-3">${p.grad || "-"}</td>
        <td class="p-3">${p.position || "-"}</td>
        <td class="p-3">${p.state || "-"}</td>
        <td class="p-3">${p.school || "-"}</td>
        <td class="p-3 text-yellow-500">${stars(p.stars)}</td>
        <td class="p-3 font-bold">${p.rank || i+1}</td>
        <td class="p-3 text-blue-600">${p.commit || "-"}</td>
      </tr>
    `).join("");
}
</script>

</body>
</html>
