<!DOCTYPE html>
<html>
<head>
  <title>Players</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white">

<!-- NAVBAR -->
<div class="bg-black border-b border-gray-800 px-8 py-4 flex justify-between items-center">
  <h1 class="text-2xl font-bold text-blue-400">LacrosseHub</h1>

  <div class="space-x-6 text-lg">
    <a href="index.html" class="hover:text-blue-400">Home</a>
    <a href="rankings.html" class="hover:text-blue-400">Rankings</a>
    <a href="players.html" class="text-blue-400">Players</a>
    <a href="events.html" class="hover:text-blue-400">Events</a>
  </div>
</div>

<div class="text-center py-12">
  <h2 class="text-4xl font-bold">Players</h2>
</div>

<div class="max-w-6xl mx-auto p-8 grid grid-cols-1 md:grid-cols-2 gap-6" id="players"></div>

<script>
fetch("/api/players")
  .then(r => r.json())
  .then(data => {
    document.getElementById("players").innerHTML =
      data.map(p => `
        <div class="bg-gray-800 p-6 rounded-xl shadow-lg hover:scale-105 transition">
          <h3 class="text-2xl font-bold text-blue-400">${p.name}</h3>
          <p class="mt-2">Grad: ${p.grad}</p>
          <p>Position: ${p.position}</p>
          <p>Goals: ${p.goals}</p>
        </div>
      `).join("");
  });
</script>

</body>
</html>
