<!DOCTYPE html>
<html>
<head>
  <title>Players</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<!-- NAV -->
<div class="bg-green-500 px-4 py-3 flex justify-between items-center">

  <h1 class="text-xl md:text-2xl font-bold">
    LacrosseHub
  </h1>

  <div class="hidden md:flex space-x-6 font-semibold">
    <a href="index.html">Home</a>
    <a href="rankings.html">Rankings</a>
    <a href="players.html">Players</a>
    <a href="events.html">Events</a>
  </div>

  <button class="md:hidden text-2xl" onclick="toggleMenu()">
    ☰
  </button>

</div>

<!-- MOBILE MENU -->
<div id="mobileMenu"
class="hidden bg-green-400 px-4 py-4 space-y-3 md:hidden">

  <a href="index.html" class="block">Home</a>
  <a href="rankings.html" class="block">Rankings</a>
  <a href="players.html" class="block">Players</a>
  <a href="events.html" class="block">Events</a>

</div>

<!-- MAIN -->
<div class="max-w-7xl mx-auto mt-6 px-4">

  <div class="bg-white rounded shadow p-4">

    <h2 class="text-2xl font-bold mb-4">
      Player Rankings
    </h2>

    <!-- SCROLLABLE TABLE -->
    <div class="overflow-y-auto overflow-x-auto border rounded"
    style="max-height: 700px;">

      <table class="w-full text-sm">

        <thead class="bg-gray-200 sticky top-0">

          <tr>

            <th class="p-3 text-left">RANK</th>
            <th class="p-3 text-left">PLAYER</th>
            <th class="p-3 text-left">CLASS</th>
            <th class="p-3 text-left">POSITION</th>
            <th class="p-3 text-left">STATE</th>
            <th class="p-3 text-left">SCHOOL</th>
            <th class="p-3 text-left">⭐</th>
            <th class="p-3 text-left">COMMIT</th>

          </tr>

        </thead>

        <tbody id="players"></tbody>

      </table>

    </div>

  </div>

</div>

<script>

function toggleMenu() {

  document
    .getElementById("mobileMenu")
    .classList
    .toggle("hidden");

}

fetch("/api/players")
.then(r => r.json())
.then(data => {

  // SORT PLAYERS BY RANK
  data.sort((a, b) => {

    return Number(a.rank || 9999)
      - Number(b.rank || 9999);

  });

  document.getElementById("players").innerHTML =

    data.map(player => `

      <tr class="border-b hover:bg-gray-100">

        <td class="p-3 font-bold">
          #${player.rank || "-"}
        </td>

        <td class="p-3 font-semibold">
          ${player.name || "-"}
        </td>

        <td class="p-3">
          ${player.grad || "-"}
        </td>

        <td class="p-3">
          ${player.position || "-"}
        </td>

        <td class="p-3">
          ${player.state || "-"}
        </td>

        <td class="p-3">
          ${player.school || "-"}
        </td>

        <td class="p-3 text-yellow-500">
          ${"★".repeat(Number(player.stars || 0))}
        </td>

        <td class="p-3 text-blue-600 font-semibold">
          ${player.commit || "-"}
        </td>

      </tr>

    `).join("");

});

</script>

</body>
</html>
