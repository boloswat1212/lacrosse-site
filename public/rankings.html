<!DOCTYPE html>
<html>
<head>
  <title>Rankings</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white">

<!-- NAVBAR -->
<div class="bg-black border-b border-gray-800 px-8 py-4 flex justify-between items-center">
  <h1 class="text-2xl font-bold text-blue-400">LacrosseHub</h1>

  <div class="space-x-6 text-lg">
    <a href="index.html" class="hover:text-blue-400">Home</a>
    <a href="rankings.html" class="text-blue-400">Rankings</a>
    <a href="players.html" class="hover:text-blue-400">Players</a>
    <a href="events.html" class="hover:text-blue-400">Events</a>
  </div>
</div>

<!-- TITLE -->
<div class="text-center py-10">
  <h2 id="title" class="text-4xl font-bold">2030 Rankings</h2>
</div>

<!-- YEAR BUTTONS -->
<div class="flex justify-center gap-3 flex-wrap mb-6">

  <button onclick="loadYear(2030)" class="bg-blue-500 px-4 py-2 rounded">2030</button>
  <button onclick="loadYear(2029)" class="bg-gray-700 px-4 py-2 rounded">2029</button>
  <button onclick="loadYear(2028)" class="bg-gray-700 px-4 py-2 rounded">2028</button>
  <button onclick="loadYear(2027)" class="bg-gray-700 px-4 py-2 rounded">2027</button>
  <button onclick="loadYear(2026)" class="bg-gray-700 px-4 py-2 rounded">2026</button>
  <button onclick="loadYear(2025)" class="bg-gray-700 px-4 py-2 rounded">2025</button>
  <button onclick="loadYear('college')" class="bg-gray-700 px-4 py-2 rounded">College</button>

</div>

<!-- TABLE -->
<div class="max-w-6xl mx-auto p-8">

  <table class="w-full bg-gray-800 rounded-xl overflow-hidden text-lg">
    <thead>
      <tr class="bg-gray-700 text-blue-400">
        <th class="p-4 text-left">Rank</th>
        <th class="p-4 text-left">Team</th>
        <th class="p-4 text-left">Record</th>
      </tr>
    </thead>

    <tbody id="rankings"></tbody>
  </table>

</div>

<script>
let currentYear = 2030;

function loadYear(year) {
  currentYear = year;

  document.getElementById("title").innerText =
    (year === "college" ? "College Rankings" : year + " Rankings");

  fetch("/api/rankings/" + year)
    .then(r => r.json())
    .then(data => {
      document.getElementById("rankings").innerHTML =
        data.map(r => `
          <tr class="border-b border-gray-700 hover:bg-gray-700 transition">
            <td class="p-4 font-bold text-blue-400">#${r.rank}</td>
            <td class="p-4">${r.team}</td>
            <td class="p-4">${r.record}</td>
          </tr>
        `).join("");
    });
}

// LOAD DEFAULT
loadYear(2030);
</script>

</body>
</html>
